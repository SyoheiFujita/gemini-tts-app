<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TTS音声生成">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Gemini TTS 音声生成</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --fg:#1d2330; --muted:#6b7280; --line:#e3e6eb; --accent:#2563eb; --ok:#16803c; --err:#c0392b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161b; --card:#1d2027; --fg:#e8eaef; --muted:#9aa1ad; --line:#2d313a; --accent:#5b8cff; --ok:#4ccb7a; --err:#ff7b6b; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.6 system-ui, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif; }
  main { max-width: 820px; margin: 0 auto;
    padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(48px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 18px; font-size: 13px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:14px; }
  label { display:block; font-weight:600; font-size:13px; margin-bottom:6px; }
  input, textarea { width:100%; padding:10px; border:1px solid var(--line); border-radius:7px; background:var(--bg); color:var(--fg); font:inherit; font-size:16px; }
  textarea { min-height: 260px; resize: vertical; }
  .row { display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
  .field { margin-bottom: 12px; }
  .hint { color:var(--muted); font-size:12px; margin-top:4px; }
  .counter { text-align:right; font-size:12px; color:var(--muted); margin-top:4px; }
  .counter.over { color: var(--err); font-weight:600; }
  button { background:var(--accent); color:#fff; border:0; border-radius:7px; padding:10px 18px; min-height:46px; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--line); }
  .actions { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  a { color: var(--accent); font-weight:600; }
  details summary { cursor:pointer; font-weight:600; font-size:14px; }
  details[open] summary { margin-bottom: 12px; }
  #msg { margin-top:10px; font-size:13px; white-space:pre-wrap; }
  #msg.e { color: var(--err); }
  .jobs { list-style:none; margin:0; padding:0; display:grid; gap:10px; }
  .job { border:1px solid var(--line); border-radius:8px; padding:10px 12px; min-width:0; }
  .job .name { font-size:13px; word-break: break-all; }
  .job .st { font-size:12px; color:var(--muted); margin-top:2px; }
  .job .st.done { color: var(--ok); font-weight:600; }
  .job .st.error { color: var(--err); }
  .job progress { width:100%; height:6px; margin-top:6px; }
  .empty { color:var(--muted); font-size:13px; }
  @media (max-width: 600px) {
    .row { grid-template-columns: 1fr; }
    .actions button { flex: 1 1 100%; }
    #go { font-size: 17px; }
    textarea { min-height: 220px; }
  }
</style>
</head>
<body>
<main>
  <h1>Gemini TTS 音声生成</h1>
  <p class="sub">最大3000文字を音声にして Google ドライブに保存します。送信したらページを閉じても大丈夫です。</p>

  <details class="card" id="settings">
    <summary>設定</summary>
    <div class="field">
      <label for="gasUrl">保存用スクリプトのURL</label>
      <input id="gasUrl" type="url" autocomplete="off" placeholder="https://script.google.com/macros/s/.../exec">
    </div>
    <div class="field">
      <label for="gasToken">合言葉</label>
      <input id="gasToken" type="password" autocomplete="off">
      <div class="hint">設定方法は <a href="https://github.com/SyoheiFujita/gemini-tts-app#設定" target="_blank" rel="noopener">こちら</a>。この2つはこのブラウザ内にだけ保存されます。</div>
    </div>
    <div class="row">
      <div class="field">
        <label for="voice">ボイス</label>
        <input id="voice" value="test1101">
        <div class="hint">表示名、voice_… のID、またはプリセット名</div>
      </div>
      <div class="field">
        <label for="style">スタイル（任意）</label>
        <input id="style" placeholder="例: 落ち着いたナレーション調で">
        <div class="hint">デザインボイスの場合は空欄推奨</div>
      </div>
    </div>
    <div class="field">
      <label for="model">モデルID</label>
      <input id="model" value="gemini-3.8-flash-tts">
    </div>
    <button id="listVoices" class="ghost">ボイス一覧を確認</button>
  </details>

  <div class="card">
    <label for="text">読み上げテキスト</label>
    <textarea id="text" placeholder="ここに読み上げる文章を入力（最大3000文字）"></textarea>
    <div class="counter" id="counter">0 / 3000</div>
    <div class="actions" style="margin-top:10px">
      <button id="go">音声を生成してドライブに保存</button>
    </div>
    <div id="msg"></div>
  </div>

  <div class="card">
    <label>最近の依頼</label>
    <ul class="jobs" id="jobs"></ul>
    <div class="hint">完成すると保存先フォルダに WAV ファイルができます。3000文字でおよそ5〜10分かかります。</div>
  </div>
</main>

<script>
const MAX_CHARS = 3000;
const $ = id => document.getElementById(id);
const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch {} },
};
const FIELDS = ["gasUrl","gasToken","voice","style","model"];
FIELDS.forEach(id => {
  const v = store.get("tts_"+id); if (v !== null && v !== "") $(id).value = v;
  $(id).addEventListener("change", () => store.set("tts_"+id, $(id).value.trim()));
});
if (!$("gasUrl").value || !$("gasToken").value) $("settings").open = true;

const textEl = $("text");
const draft = store.get("tts_draft"); if (draft) textEl.value = draft;
function updateCounter(){
  const n = [...textEl.value].length;
  $("counter").textContent = `${n} / ${MAX_CHARS}`;
  $("counter").classList.toggle("over", n > MAX_CHARS);
}
textEl.addEventListener("input", () => { updateCounter(); store.set("tts_draft", textEl.value); });
updateCounter();

function say(t, isErr){ $("msg").textContent = t; $("msg").className = isErr ? "e" : ""; }

async function call(body){
  const url = $("gasUrl").value.trim(), token = $("gasToken").value.trim();
  if (!url.startsWith("https://script.google.com/")) throw new Error("設定で「保存用スクリプトのURL」を入力してください");
  if (!token) throw new Error("設定で「合言葉」を入力してください");
  let r;
  try {
    r = await fetch(url, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
                           body: JSON.stringify({ token, ...body }) });
  } catch { throw new Error("スクリプトに接続できません。URL と、デプロイの「アクセスできるユーザー: 全員」を確認してください"); }
  const t = await r.text();
  let j; try { j = JSON.parse(t); } catch { throw new Error("スクリプトの応答が読めません。URL（/exec で終わるもの）を確認してください"); }
  if (!j.ok) throw new Error(j.error || "エラーが発生しました");
  return j;
}

// ---- 依頼の一覧（このブラウザに最近20件を記録） ----
let jobs = []; try { jobs = JSON.parse(store.get("tts_jobs") || "[]"); } catch {}
const saveJobs = () => store.set("tts_jobs", JSON.stringify(jobs.slice(0, 20)));
const STATE = { queued: "順番待ち", generating: "音声を生成中", saving: "ドライブに保存中", done: "保存しました", error: "失敗しました" };

function renderJobs(){
  const ul = $("jobs"); ul.innerHTML = "";
  if (!jobs.length) { ul.innerHTML = '<li class="empty">まだありません</li>'; return; }
  for (const j of jobs) {
    const li = document.createElement("li"); li.className = "job";
    const name = document.createElement("div"); name.className = "name"; name.textContent = j.filename || j.id;
    const st = document.createElement("div"); st.className = "st " + (j.state || "");
    let label = STATE[j.state] || "確認中";
    if (j.state === "generating" && j.total) label += `（${j.done}/${j.total}）`;
    if (j.state === "error" && j.error) label += `: ${j.error}`;
    st.textContent = label;
    li.append(name, st);
    if (j.state === "done" && j.url) {
      const a = document.createElement("a"); a.href = j.url; a.target = "_blank"; a.rel = "noopener";
      a.textContent = "ドライブで開く"; a.style.fontSize = "13px";
      li.append(a);
    } else if (j.state !== "error" && j.total) {
      const p = document.createElement("progress"); p.max = j.total + 1;
      p.value = (j.done || 0) + (j.state === "saving" ? 1 : 0);
      li.append(p);
    }
    ul.append(li);
  }
}

let polling = null;
async function refresh(){
  const active = jobs.filter(j => j.state !== "done" && j.state !== "error");
  if (!active.length) { clearInterval(polling); polling = null; return; }
  try {
    const r = await call({ action: "status", ids: active.map(j => j.id) });
    for (const j of jobs) { const s = r.jobs[j.id]; if (s) Object.assign(j, s); }
    saveJobs(); renderJobs();
  } catch {}
}
function startPolling(){ if (!polling) polling = setInterval(refresh, 10000); refresh(); }
document.addEventListener("visibilitychange", () => { if (!document.hidden) startPolling(); });

$("go").addEventListener("click", async () => {
  const text = textEl.value.trim();
  if (!text) return say("テキストを入力してください", true);
  if ([...text].length > MAX_CHARS) return say(`テキストは${MAX_CHARS}文字以内にしてください`, true);
  FIELDS.forEach(id => store.set("tts_"+id, $(id).value.trim()));
  $("go").disabled = true; say("送信中…");
  try {
    const r = await call({ text, voice: $("voice").value.trim(), style: $("style").value.trim(), model: $("model").value.trim() });
    jobs.unshift({ id: r.id, filename: r.filename, state: "queued", done: 0, total: r.total });
    saveJobs(); renderJobs(); startPolling();
    say("受け付けました。このページを閉じても、完成するとドライブに保存されます。");
    textEl.value = ""; store.set("tts_draft", ""); updateCounter();
  } catch (e) { say(e.message, true); }
  finally { $("go").disabled = false; }
});

$("listVoices").addEventListener("click", async () => {
  say("ボイス一覧を取得中…");
  try {
    const r = await call({ action: "voices" });
    say(r.voices.length ? r.voices.map(v => `${v.name || "(名前なし)"} → ${v.id}`).join("\n") : "保存済みボイスはありません");
  } catch (e) { say(e.message, true); }
});

renderJobs(); startPolling();
</script>
</body>
</html>
